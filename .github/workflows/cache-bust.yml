name: Cache bust deployed loader
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cache-bust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh deployed loader version and hatchery copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,re
          p=Path('index.html')
          s=p.read_text()
          sha=subprocess.check_output(['git','rev-parse','--short','HEAD'], text=True).strip()
          s=re.sub(r'game\.js\?v=[^"\']+', f'game.js?v={sha}', s)
          s=s.replace('Duplicate beasts become Ascension copies instead of being wasted.', 'Every egg hatches an individual beast with its own level and XP. Duplicate species can be trained separately or sacrificed for Ascension.')
          p.write_text(s)
          PY
      - name: Commit cache bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Bust deployed game loader cache"
            git push
          fi