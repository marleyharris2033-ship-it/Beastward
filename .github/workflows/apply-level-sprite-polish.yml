name: Apply level and sprite polish

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-level-sprite-polish.yml'

permissions:
  contents: write

jobs:
  apply-polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Beastward
        run: python .github/scripts/apply_polish.py
      - name: Syntax check
        run: node --check game.js
      - name: Commit polish
        run: |
          git config user.name "Beastward Builder"
          git config user.email "actions@users.noreply.github.com"
          git add game.js style.css index.html
          git commit -m "Make every level path unique and enlarge beast sprites"
          git push origin main
